<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameChat Hub</title>
<!-- PeerJS Library for Internet P2P Networking -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#090d18;
  color:#f4f7ff;
  overflow:hidden;
}
button,input{font:inherit}
button{cursor:pointer}
#app{height:100%;display:flex;flex-direction:column}
.topbar{
  height:64px;display:flex;align-items:center;gap:12px;
  padding:0 18px;background:#11182a;border-bottom:1px solid #28334e;
}
.logo{font-size:21px;font-weight:800;margin-right:auto}
.logo span{color:#6ea8ff}
.tab{
  border:0;border-radius:10px;padding:10px 16px;
  color:#cbd5e1;background:#1a2338;
}
.tab.active{background:#3b82f6;color:white}
.profile{
  display:flex;align-items:center;gap:9px;
  padding:7px 10px;background:#192238;border-radius:10px;
  font-size:13px;
}
.dot{width:9px;height:9px;border-radius:50%;background:#ef4444}
.dot.online{background:#45e38b}
.view{display:none;flex:1;min-height:0}
.view.active{display:flex}

/* Games Section Styling */
#games{padding:18px;gap:18px;display:none}
#games.active{display:flex}
.game-sidebar{
  width:260px;display:flex;flex-direction:column;gap:10px;
}
.game-btn{
  display:flex;align-items:center;gap:10px;padding:12px;
  background:#11182a;border:1px solid #28334e;border-radius:12px;
  color:#f4f7ff;text-align:left;font-size:15px;font-weight:600;
  transition:all 0.2s;
}
.game-btn:hover{background:#1a243d;border-color:#3b82f6}
.game-btn.active{background:#2563eb;border-color:#3b82f6}
.game-wrap{
  flex:1;height:100%;border:1px solid #28334e;border-radius:14px;
  overflow:hidden;background:#01061c;position:relative;display:flex;
  align-items:center;justify-content:center;
}
#gameFrame{width:100%;height:100%;border:0;background:#01061c}

/* Chat Styling */
#chat{padding:18px;gap:18px}
.chat-main{
  flex:1;min-width:0;display:flex;flex-direction:column;
  background:#11182a;border:1px solid #28334e;border-radius:14px;overflow:hidden;
}
.chat-head{
  padding:16px 18px;border-bottom:1px solid #28334e;
  display:flex;align-items:center;justify-content:space-between;
}
.chat-head strong{font-size:18px}
.status-badge{font-size:12px;color:#94a3b8;background:#182238;padding:4px 10px;border-radius:12px}
#messages{
  flex:1;overflow:auto;padding:18px;
  display:flex;flex-direction:column;gap:10px;
}
.msg{
  max-width:75%;padding:10px 13px;border-radius:12px;
  background:#1b2740;align-self:flex-start;
}
.msg.me{background:#2563eb;align-self:flex-end}
.msg.system{
  align-self:center;background:transparent;color:#64748b;
  font-size:12px;font-style:italic;padding:4px;
}
.msg .who{font-size:11px;opacity:.7;margin-bottom:4px}
.msg .text{white-space:pre-wrap;overflow-wrap:anywhere}
.chat-input{display:flex;gap:9px;padding:12px;border-top:1px solid #28334e}
.chat-input input{
  flex:1;min-width:0;border:1px solid #33415f;border-radius:10px;
  padding:11px 12px;background:#0b1120;color:white;outline:none;
}
.chat-input button,.primary{
  border:0;border-radius:10px;padding:11px 16px;background:#3b82f6;color:white;
}
.sidebar{
  width:280px;display:flex;flex-direction:column;gap:12px;
}
.card{
  background:#11182a;border:1px solid #28334e;border-radius:14px;padding:16px;
}
.card h3{margin:0 0 12px}
.account-name{font-size:20px;font-weight:800;word-break:break-word}
.friend-code{
  margin-top:7px;font-family:monospace;font-size:20px;
  letter-spacing:1px;color:#78b0ff;
}
.small{font-size:12px;color:#94a3b8;line-height:1.4}
.secondary{
  width:100%;border:1px solid #33415f;border-radius:9px;
  padding:9px;background:#182238;color:#dbeafe;margin-top:10px;
}
.room-list{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto;margin-bottom:10px}
.room-btn{
  text-align:left;background:#182238;border:1px solid #28334e;
  color:#cbd5e1;padding:8px 12px;border-radius:8px;font-size:14px;
}
.room-btn.active{background:#2563eb;color:white;border-color:#3b82f6}
.custom-room-box{display:flex;gap:6px}
.custom-room-box input{
  flex:1;min-width:0;border:1px solid #33415f;border-radius:8px;
  padding:6px 8px;background:#0b1120;color:white;font-size:12px;outline:none;
}
.custom-room-box button{border:0;border-radius:8px;padding:6px 12px;background:#3b82f6;color:white;font-size:12px}

.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.72);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;
}
.modal.hidden{display:none}
.signup{
  width:min(420px,100%);background:#11182a;border:1px solid #34415e;
  border-radius:18px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.signup h1{margin:0 0 7px}
.signup p{margin:0 0 20px;color:#94a3b8}
.signup label{display:block;font-size:13px;margin:13px 0 7px;color:#cbd5e1}
.signup input{
  width:100%;border:1px solid #33415f;border-radius:10px;
  padding:12px;background:#0b1120;color:white;outline:none;
}
.signup .primary{width:100%;margin-top:18px}
.error{min-height:18px;color:#ff7d7d;font-size:12px;margin-top:8px}
@media(max-width:760px){
  .sidebar,.game-sidebar{display:none}
  #chat,#games{padding:8px}
  .logo{font-size:17px}
  .profile{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="logo">Game<span>Chat</span> Hub</div>
    <button class="tab active" data-view="games">🎮 Games</button>
    <button class="tab" data-view="chat">💬 Chat</button>
    <div class="profile"><span class="dot" id="netDot"></span><span id="topUser">Not signed up</span></div>
  </div>

  <section id="games" class="view active">
    <aside class="game-sidebar">
      <div class="card">
        <h3>Arcade Games</h3>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <button class="game-btn active" data-src="https://playcanv.as/p/2O2OeL1Y/">🐍 Snake 3D</button>
          <button class="game-btn" data-src="https://html5.gamedistribution.com/rvvASyc0153835694a5e4a8385311263/">🏎️ Rush Racing</button>
          <button class="game-btn" data-src="https://games.freemonkeygames.com/2048/">🔢 2048 Puzzle</button>
        </div>
      </div>
    </aside>
    <div class="game-wrap">
      <iframe id="gameFrame" src="https://playcanv.as/p/2O2OeL1Y/" title="Arcade Game"></iframe>
    </div>
  </section>

  <section id="chat" class="view">
    <aside class="sidebar">
      <div class="card">
        <h3>Chat Rooms</h3>
        <div class="room-list" id="roomList">
          <button class="room-btn active" data-room="global">🌐 General</button>
          <button class="room-btn" data-room="lfg">🎮 LFG / Find Players</button>
          <button class="room-btn" data-room="offtopic">☕ Off-Topic</button>
        </div>
        <div class="custom-room-box">
          <input id="customRoomInput" placeholder="Join custom room..." maxlength="20">
          <button id="joinCustomBtn">Join</button>
        </div>
      </div>
      <div class="card">
        <h3>Your account</h3>
        <div class="account-name" id="sideUser">Not signed up</div>
        <div class="small">Peer Network ID</div>
        <div class="friend-code" id="sideCode">------</div>
        <button class="secondary" id="copyCode">Copy Peer ID</button>
      </div>
    </aside>

    <main class="chat-main">
      <div class="chat-head">
        <strong id="currentRoomTitle"># General</strong>
        <span class="status-badge" id="peerStatus">Connecting to Network...</span>
      </div>
      <div id="messages"></div>
      <div class="chat-input">
        <input id="messageInput" maxlength="500" placeholder="Type a message..." autocomplete="off">
        <button id="sendBtn">Send</button>
      </div>
    </main>
  </section>
</div>

<div class="modal" id="signupModal">
  <form class="signup" id="signupForm">
    <h1>Welcome to GameChat</h1>
    <p>Create your account to start using chat.</p>
    <label for="username">Username</label>
    <input id="username" maxlength="24" minlength="2" required
           placeholder="Choose a username" autocomplete="nickname">
    <div class="small">2–24 characters. Letters, numbers, spaces, _ and - are allowed.</div>
    <div class="error" id="signupError"></div>
    <button class="primary" type="submit">Create account</button>
  </form>
</div>

<script>
// State
let currentUser = localStorage.getItem('gc_username') || '';
let currentRoom = 'global';
let peer = null;
let connections = []; 
let peerRoomRegistry = {}; 

// UI References
const topUser = document.getElementById('topUser');
const sideUser = document.getElementById('sideUser');
const sideCode = document.getElementById('sideCode');
const signupModal = document.getElementById('signupModal');
const signupForm = document.getElementById('signupForm');
const usernameInput = document.getElementById('username');
const signupError = document.getElementById('signupError');
const messagesDiv = document.getElementById('messages');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const peerStatus = document.getElementById('peerStatus');
const netDot = document.getElementById('netDot');
const roomList = document.getElementById('roomList');
const currentRoomTitle = document.getElementById('currentRoomTitle');
const gameFrame = document.getElementById('gameFrame');

// Navigation Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.view).classList.add('active');
  });
});

// Game Switcher Handler
document.querySelectorAll('.game-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.game-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    gameFrame.src = btn.dataset.src;
  });
});

// Account Check
if (!currentUser) {
  signupModal.classList.remove('hidden');
} else {
  initUserAccount(currentUser);
}

signupForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const val = usernameInput.value.trim();
  if (/^[a-zA-Z0-9_\- ]{2,24}$/.test(val)) {
    currentUser = val;
    localStorage.setItem('gc_username', currentUser);
    signupModal.classList.add('hidden');
    initUserAccount(currentUser);
  } else {
    signupError.textContent = 'Invalid username format.';
  }
});

function initUserAccount(username) {
  topUser.textContent = username;
  sideUser.textContent = username;
  initPeerNetwork();
}

// PeerJS Realtime Internet Networking Implementation
function initPeerNetwork() {
  const cleanUser = currentUser.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
  const randomSuffix = Math.floor(1000 + Math.random() * 9000);
  const peerId = `gc-v1-${cleanUser}-${randomSuffix}`;
  
  sideCode.textContent = peerId.slice(-6).toUpperCase();
  
  peer = new Peer(peerId, { debug: 1 });

  peer.on('open', (id) => {
    peerStatus.textContent = `Connected (Online)`;
    netDot.classList.add('online');
    addSystemMessage(`Connected to global network as ${currentUser}.`);
    announcePresenceInRoom();
  });

  peer.on('connection', (conn) => {
    setupConnection(conn);
  });

  peer.on('error', (err) => {
    console.error('Peer error:', err);
    peerStatus.textContent = 'Network warning';
  });
}

function setupConnection(conn) {
  conn.on('open', () => {
    if (!connections.some(c => c.peer === conn.peer)) {
      connections.push(conn);
    }
  });

  conn.on('data', (data) => {
    if (data.type === 'announce') {
      peerRoomRegistry[conn.peer] = { room: data.room, user: data.username };
      if (data.room === currentRoom && data.reply) {
        conn.send({ type: 'announce', room: currentRoom, username: currentUser, reply: false });
      }
    } else if (data.type === 'chat') {
      if (data.room === currentRoom) {
        addMessage(data.username, data.message, false);
      }
    }
  });

  conn.on('close', () => {
    connections = connections.filter(c => c.peer !== conn.peer);
    delete peerRoomRegistry[conn.peer];
  });
}

function announcePresenceInRoom() {
  connections.forEach(conn => {
    if (conn.open) {
      conn.send({ type: 'announce', room: currentRoom, username: currentUser, reply: true });
    }
  });
}

// Room Management
function switchRoom(roomName, label) {
  currentRoom = roomName;
  currentRoomTitle.textContent = `# ${label || roomName}`;
  messagesDiv.innerHTML = '';
  addSystemMessage(`Switched to room #${label || roomName}. Searching peers...`);
  announcePresenceInRoom();
}

roomList.addEventListener('click', (e) => {
  if (e.target.classList.contains('room-btn')) {
    document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    switchRoom(e.target.dataset.room, e.target.textContent.replace(/^[\s\S]*?\s/, ''));
  }
});

document.getElementById('joinCustomBtn').addEventListener('click', () => {
  const input = document.getElementById('customRoomInput');
  const roomName = input.value.trim().toLowerCase().replace(/[^a-z0-9\-]/g, '');
  if (roomName) {
    document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
    const btn = document.createElement('button');
    btn.className = 'room-btn active';
    btn.dataset.room = roomName;
    btn.textContent = `🔒 ${roomName}`;
    roomList.appendChild(btn);
    switchRoom(roomName, roomName);
    input.value = '';
  }
});

// Chat Output & Messaging
function addMessage(who, text, isMe) {
  const msgDiv = document.createElement('div');
  msgDiv.className = `msg ${isMe ? 'me' : ''}`;
  
  const whoDiv = document.createElement('div');
  whoDiv.className = 'who';
  whoDiv.textContent = who;
  
  const textDiv = document.createElement('div');
  textDiv.className = 'text';
  textDiv.textContent = text;
  
  msgDiv.appendChild(whoDiv);
  msgDiv.appendChild(textDiv);
  messagesDiv.appendChild(msgDiv);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function addSystemMessage(text) {
  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg system';
  msgDiv.textContent = text;
  messagesDiv.appendChild(msgDiv);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function sendMessage() {
  const text = messageInput.value.trim();
  if (!text) return;
  
  addMessage(currentUser, text, true);
  messageInput.value = '';

  connections.forEach(conn => {
    if (conn.open) {
      conn.send({
        type: 'chat',
        room: currentRoom,
        username: currentUser,
        message: text
      });
    }
  });
}

sendBtn.addEventListener('click', sendMessage);
messageInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});

document.getElementById('copyCode').addEventListener('click', () => {
  if (peer && peer.id) {
    navigator.clipboard.writeText(peer.id);
    alert('Peer ID copied to clipboard!');
  }
});
</script>
</body>
</html>
